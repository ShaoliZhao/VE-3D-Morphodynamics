[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vec-3d-morphodynamics-lab"
version = "0.1.0"
description = "Frame-aware transport, scale and chirality modeling for Virtual Embryo Task 2"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = {text = "MIT"}

[project.scripts]
vec-morph = "vec_morph.cli:main"

[tool.setuptools.packages.find]
include = ["vec_morph*", "vec_chirality*"]
